name: Publish Sogang notices

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Rolling batch, or full bootstrap/repair (contacts every board)'
        type: choice
        required: true
        default: rolling
        options: [rolling, full]
      meal_mode:
        description: 'Rolling requires published meals; bootstrap explicitly initializes or repairs them'
        type: choice
        required: true
        default: rolling
        options: [rolling, bootstrap]

permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      needsOcr: ${{ steps.prepare.outputs.needsOcr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - name: Prepare complete notices and bounded meal inputs
        id: prepare
        env:
          COLLECTION_MODE: ${{ inputs.mode || 'rolling' }}
          MEAL_MODE: ${{ inputs.meal_mode || 'rolling' }}
        run: npm run meals:prepare -- "--notice-mode=$COLLECTION_MODE" "--meal-mode=$MEAL_MODE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prepared
          path: work/
          if-no-files-found: error
          retention-days: 1

  ocr:
    needs: prepare
    if: needs.prepare.outputs.needsOcr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prepared
          path: work/
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.13'
          cache: pip
          cache-dependency-path: ocr/requirements.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r ocr/requirements.lock
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ocr/models/
          key: bellarmine-${{ runner.os }}-python313-${{ hashFiles('ocr/requirements.lock', 'ocr/models.json') }}
      - name: Install or verify pinned model assets
        run: python ocr/download_models.py --output ocr/models
      - name: Test without creating an OCR engine
        run: python -m unittest discover -s ocr -p 'test_*.py' -v
      - name: Extract local images with a process deadline
        run: timeout 300s python ocr/run_bellarmine.py --work work --models ocr/models
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ocr-results
          path: work/ocr-results.json
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: [prepare, ocr]
    if: >-
      always() && needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.needsOcr == 'true' && needs.ocr.result == 'success') ||
      (needs.prepare.outputs.needsOcr == 'false' && needs.ocr.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: prepared
          path: work/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.prepare.outputs.needsOcr == 'true'
        with:
          name: ocr-results
          path: work/
      - name: Validate and stage all 41 feeds plus meals
        run: npm run meals:assemble
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: meal-site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
