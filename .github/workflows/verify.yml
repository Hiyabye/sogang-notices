name: Verify Sogang notices

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-notices
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Collect validated notices
        run: npm run collect
      - name: Show validated public feed
        run: node --input-type=module -e "import { readFile } from 'node:fs/promises'; console.log(await readFile('public/notices.json', 'utf8'))"
